server:
  port: 8080

spring:
  application:
    name: shipment-tracking-gateway
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:gatewaydb}
    username: ${DB_USER:gateway}
    password: ${DB_PASS:gateway}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 5m
  elasticsearch:
    uris: http://${ES_HOST:localhost}:${ES_PORT:9200}
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never   # Flyway handles it via V3 migration
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      elasticsearch:
        index-name: shipments-vectors
        dimensions: 1536          # matches text-embedding-3-small
        similarity: cosine
        initialize-schema: true   # creates the ES index on first run

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 1h
    refresh-expiration: 7d
